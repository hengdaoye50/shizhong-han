<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>两汉侍中数据库 · Shizhong of the Han</title>
  <meta name="description" content="两汉可考侍中人物卡片、任职履历与关系图谱" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div>
        <h1 class="brand-title brand-title--calli">两汉侍中数据库</h1>
      </div>
    </div>
    <div class="header-meta">
      <span id="stat-persons">—</span> 人
      <span class="dot"></span>
      <span id="stat-relations">—</span> 关系
      <span class="dot"></span>
      <span id="stat-sources">—</span> 史料
    </div>
  </header>

  <nav class="site-nav" aria-label="站点导航">
    <a href="index.html" class="active">图谱名录</a>
    <a href="timeline.html">时间轴</a>
    <a href="about.html">方法说明</a>
    <a class="nav-ext" href="https://github.com/hengdaoye50/shizhong-han" target="_blank" rel="noopener">GitHub ↗</a>
  </nav>

  <section class="graph-stage" aria-label="侍中关系图谱">
    <canvas id="graph-canvas"></canvas>
    <div class="graph-overlay">
      <p class="eyebrow">Knowledge Graph</p>
      <h2 class="hero-title">侍中网络<br /><em>可考关系</em></h2>
      <p class="hero-sub">
        节点大小映射关系边数。拖拽旋转，点击节点查看卡片。
      </p>
      <div class="graph-legend">
        <span><i class="lg-dot lg-hi"></i>关系密集</span>
        <span><i class="lg-dot lg-mid"></i>中等</span>
        <span><i class="lg-dot lg-lo"></i>少边</span>
      </div>
      <div class="graph-hint" id="graph-hint">悬停或点击节点 · 滚轮缩放 · 拖拽视角</div>
    </div>
    <div class="graph-toolbar">
      <button type="button" class="chip active" id="btn-rotate">自转</button>
      <button type="button" class="chip" id="btn-reset">复位</button>
    </div>
  </section>

  <main class="layout">
    <section class="toolbar">
      <label class="search-wrap">
        <span class="sr-only">搜索</span>
        <input id="search" type="search" placeholder="搜索姓名、字、籍贯、类属…" autocomplete="off" />
      </label>
      <div class="filters" id="dynasty-filters"></div>
      <div class="sort-row">
        <button type="button" class="chip active" data-sort="dynasty">按朝代</button>
        <button type="button" class="chip" data-sort="name">按姓名</button>
        <button type="button" class="chip" data-sort="terms">按任职证据</button>
      </div>
    </section>

    <section class="results-head">
      <p id="result-count">加载中…</p>
    </section>

    <section class="person-grid" id="person-grid" aria-live="polite"></section>
    <div id="empty-state" class="empty" hidden>
      <p>没有匹配的人物。试试「窦」「金」「外戚」或清空筛选。</p>
    </div>
  </main>

  <aside id="detail" class="detail" hidden aria-modal="true" role="dialog">
    <button type="button" class="detail-close" id="detail-close" aria-label="关闭">×</button>
    <div id="detail-body"></div>
  </aside>
  <div id="detail-backdrop" class="backdrop" hidden></div>

  <footer class="site-footer">
    <p>两汉正史与金石辑本 · <span id="updated"></span></p>
  </footer>

  <script src="assets/graph.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
